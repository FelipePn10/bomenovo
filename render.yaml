# Deploy gratuito da API no Render (https://render.com) usando "Blueprint".
# Cria o serviço web (FastAPI) e um banco PostgreSQL gratuito.
services:
  - type: web
    name: api-tarefas
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: SECRET_KEY
        generateValue: true          # o Render gera uma chave aleatória
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"                # token vale 24h
      - key: DATABASE_URL
        fromDatabase:
          name: tarefas-db
          property: connectionString

databases:
  - name: tarefas-db
    plan: free
