# Gera o APK do app Flutter no GitHub.
# - Todo push na main (que mexa no app): APK fica disponível em Actions > execução > "Artifacts"
# - Criando uma tag (ex.: v1.0.0): o APK é publicado na página "Releases" para download
name: Build APK

on:
  push:
    branches: [main]
    paths: ["mobile/**", ".github/workflows/android.yml"]
    tags: ["v*"]
  workflow_dispatch: # permite rodar manualmente pela aba Actions

permissions:
  contents: write # necessário para criar a Release

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      # API_URL: endereço padrão da API dentro do APK (a API hospedada no Render).
      # Para trocar sem mexer aqui, crie a variável API_URL em Settings > Secrets and variables > Actions > Variables.
      # O endereço também pode ser trocado dentro do app, no botão "Servidor" da tela de login.
      - name: Build APK
        run: flutter build apk --release --dart-define=API_URL=${{ vars.API_URL || 'https://api-tarefas-4pv6.onrender.com' }}

      - name: Renomear APK
        run: mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/minhas-tarefas.apk

      - uses: actions/upload-artifact@v4
        with:
          name: minhas-tarefas-apk
          path: mobile/build/app/outputs/flutter-apk/minhas-tarefas.apk

      - name: Publicar na Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: mobile/build/app/outputs/flutter-apk/minhas-tarefas.apk
