# Gera o APK do app Flutter no GitHub.
# - Todo push na main (que mexa no app): APK fica disponível em Actions > execução > "Artifacts"
# - Criando uma tag (ex.: v1.0.0): o APK é publicado na página "Releases" para download
name: Build APK

on:
  push:
    branches: [main]
    paths: ["mobile/**", ".github/workflows/android.yml"]
    tags: ["v*"]
  workflow_dispatch: # permite rodar manualmente pela aba Actions

permissions:
  contents: write # necessário para criar a Release

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      # Chave de assinatura fixa (Settings > Secrets and variables > Actions > Secrets):
      # ANDROID_KEYSTORE_BASE64 (arquivo .jks em base64) e ANDROID_KEYSTORE_PASSWORD.
      # Com ela, cada versão nova instala por cima da anterior sem precisar desinstalar.
      - name: Preparar chave de assinatura
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::Sem chave de assinatura nos Secrets; o APK sairá com a chave de debug."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=minhas-tarefas"
          } > android/key.properties

      # API_URL: endereço padrão da API dentro do APK (a API hospedada no Render).
      # Para trocar sem mexer aqui, crie a variável API_URL em Settings > Secrets and variables > Actions > Variables.
      # O endereço também pode ser trocado dentro do app, no botão "Servidor" da tela de login.
      - name: Build APK
        run: flutter build apk --release --dart-define=API_URL=${{ vars.API_URL || 'https://api-tarefas-4pv6.onrender.com' }}

      - name: Renomear APK
        run: mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/minhas-tarefas.apk

      - uses: actions/upload-artifact@v4
        with:
          name: minhas-tarefas-apk
          path: mobile/build/app/outputs/flutter-apk/minhas-tarefas.apk

      - name: Publicar na Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: mobile/build/app/outputs/flutter-apk/minhas-tarefas.apk
